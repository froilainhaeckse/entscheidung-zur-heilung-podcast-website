{{ define "main" }}
<div class="row">
  <div class="col">
    <header class="page-section-header">
      <h1>{{ .Title }}</h1>
    </header>

    {{ if eq .File.Dir "ressourcen/" }}
      {{ .Content }}
    {{ else if eq .File.Dir "mitmachen/" }}
      {{ partial "mitmachen-cards.html" . }}
    {{ else }}
      {{ .Content }}
    {{ end }}
  </div>
</div>

{{ if eq .File.Dir "ressourcen/" }}
  {{ partial "ressourcen-cards.html" . }}
{{ end }}
{{ end }}
