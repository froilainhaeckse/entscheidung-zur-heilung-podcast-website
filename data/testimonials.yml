testimonials:
  - quote: "Ich wollte mich noch einmal melden und mich herzlich bei dir bedanken. Dein Podcast ist ein wesentlicher Bestandteil meines Weges zur Heilung und ich habe gerade mit Tränen in den Augen den aktuellen Beitrag von Lisa gehört. Alle Geschichten berühren mich natürlich auf ihre eigene Art und Weise, aber das was sie erlebt hat und die Schlüsse, die sie daraus zieht, sind so bewegend und ich kann sie alle so sehr fühlen. Ich bin so dankbar für unsere Begegnung und deine wertvolle Arbeit und grüße dich herzlichst aus der Ferne."
    source: "E-Mail"
  - quote: "Starkes authentisches Zeugnis, danke!"
    source: "Spotify-Kommentar"
  - quote: "Liebe Thea, ich bin auf deinen Podcast gestoßen und finde es sehr mutig und stark, dass du diese Community und diesen Austausch in die Welt rufst. ❤️💫"
    source: "Spotify-Kommentar"
