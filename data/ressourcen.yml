waehrend_schwangerschaft:
  - title: "Aktion Leben"
    url: "https://www.aktion-leben.de/"
    description: "Aktion Leben bietet umfassende Informationen, Beratung und Unterstützung rund um Schwangerschaft, Elternwerden und schwierige Entscheidungssituationen. Die Organisation begleitet einfühlsam und niedrigschwellig – sowohl online als auch vor Ort."

  - title: "Ausweg Pforzheim"
    url: "https://www.ausweg-pforzheim.de/"
    description: "Eine Beratungs- und Begleitungsstelle, die Unterstützung und offene Gespräche für Menschen in schwierigen Lebenssituationen anbietet."

nach_abtreibung:
  - title: "SaveOne Europe"
    url: "https://www.saveoneeurope.org/"
    description: "Ein internationales Netzwerk, das Menschen nach einer Abtreibung begleitet. SaveOne bietet Einzelbegleitung, Gruppenprogramme und lokale Ansprechpartner, um Heilung und Verarbeitung zu unterstützen."

  - title: "Rachels Weinberg"
    url: "https://rachelsweinberg.de/"
    description: "Ein sensibles Begleitangebot für Frauen, Männer und Paare, die nach einer Abtreibung innere Ruhe, Versöhnung und Heilungswege suchen. Die Begleitung ist erfahrungsorientiert, achtsam und anonym möglich."

  - title: "Healing Void"
    url: "https://healingvoid.mystrikingly.com/"
    description: "Ein persönliches Erfahrungs- und Unterstützungsprojekt, das Raum für Trauer, Austausch und innere Arbeit nach einer Abtreibung bietet. Besonders wertvoll für Menschen, die Raum für ihre Gefühle und Emotionen rundum ihre Entscheidung und Erfahrung haben möchten."

  - title: "Villa Vie"
    url: "https://villa-vie.org/"
    description: "Ein Angebot für Menschen, die nach einer Abtreibung Raum für Verarbeitung, Heilung und Gemeinschaft suchen."

  - title: "Schattenkind"
    url: "https://www.schattenkind.org/"
    description: "Eine Unterstützungsplattform für Menschen mit Abtreibungserfahrungen, die Raum für ihre Gefühle und Wege zur Heilung bietet."

  - title: "Nachabtreibung"
    url: "https://www.nachabtreibung.de/"
    description: "Ein Informations- und Unterstützungsangebot speziell für die Zeit nach einer Abtreibung, mit hilfreichen Ressourcen und Begleitungsmöglichkeiten."
